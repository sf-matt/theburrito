name: Publish raw Kubernetes admission webhook

on:
  push:
    branches:
      - main
    paths:
      - "raw-k8s-admission-webhooks/**"
      - ".github/workflows/publish-raw-k8s-admission-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sf-matt/raw-k8s-admission-webhook

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: raw-k8s-admission-webhooks/server/requirements.txt

      - name: Install dependencies
        working-directory: raw-k8s-admission-webhooks/server
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: raw-k8s-admission-webhooks/server
        run: python -m unittest -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: raw-k8s-admission-webhooks/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
