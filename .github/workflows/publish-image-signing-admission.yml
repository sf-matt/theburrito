name: Publish image signing admission baseline

on:
  push:
    branches:
      - main
    paths:
      - "image-signing-admission/**"
      - ".github/workflows/publish-image-signing-admission.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sf-matt/image-signing-admission

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: image-signing-admission/requirements.txt

      - name: Install dependencies
        working-directory: image-signing-admission
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: image-signing-admission
        run: python -m unittest -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=unsigned
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: image-signing-admission
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEMO_VARIANT=unsigned
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate signing-candidate tags and labels
        id: candidate-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=signing-candidate
            type=sha,prefix=signing-candidate-sha-

      - name: Build and publish signing candidate
        uses: docker/build-push-action@v6
        with:
          context: image-signing-admission
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEMO_VARIANT=signing-candidate
          push: true
          tags: ${{ steps.candidate-meta.outputs.tags }}
          labels: ${{ steps.candidate-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
