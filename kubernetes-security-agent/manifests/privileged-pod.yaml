# INTENTIONALLY UNSAFE: this Pod is privileged so the agent has a finding.
# Use only in the dedicated ai-lab namespace on an isolated test cluster.
apiVersion: v1
kind: Pod
metadata:
  name: risky-pod
  namespace: ai-lab
  labels:
    app.kubernetes.io/name: privileged-agent-test
spec:
  restartPolicy: Never
  containers:
    - name: risky
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
